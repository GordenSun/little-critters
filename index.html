<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>纸上小伙伴 · A Sociable Sketchbook</title>
  <meta name="description" content="一群由代码一笔一划画出来的小动物：靠近鼠标的会转过头盯着你看，离得远的就打哈欠、哼小曲、犯困、说小话……点一下按钮，换一批新朋友。">
  <meta name="theme-color" content="#e9e3d7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%233a2d27'%3E%3Cellipse cx='32' cy='40' rx='14' ry='11'/%3E%3Ccircle cx='14' cy='26' r='6'/%3E%3Ccircle cx='24' cy='16' r='6'/%3E%3Ccircle cx='40' cy='16' r='6'/%3E%3Ccircle cx='50' cy='26' r='6'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="paper" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="paw" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round">
          <ellipse cx="32" cy="41" rx="13" ry="10.5"/>
          <ellipse cx="14.5" cy="27" rx="5.5" ry="6.5" transform="rotate(-18 14.5 27)"/>
          <ellipse cx="25" cy="16.5" rx="5.5" ry="6.5" transform="rotate(-6 25 16.5)"/>
          <ellipse cx="39" cy="16.5" rx="5.5" ry="6.5" transform="rotate(6 39 16.5)"/>
          <ellipse cx="49.5" cy="27" rx="5.5" ry="6.5" transform="rotate(18 49.5 27)"/>
        </g>
      </svg>
      <div>
        <h1>纸上小伙伴</h1>
        <p class="tagline">a rather sociable sketchbook · 每一根线条都是代码</p>
      </div>
    </div>
    <div class="meta">
      <div class="meta-line">FIELD NOTES / <span id="batchNo">001</span></div>
      <div class="meta-line strong"><span id="countLabel">18</span> 位小伙伴 · <span id="speciesLabel">12</span> 个物种</div>
    </div>
  </header>

  <main class="stage">
    <canvas id="stage" aria-label="一群由代码绘制的小动物"></canvas>
  </main>

  <footer class="bottombar">
    <p class="caption" id="caption">把鼠标移过去，附近的小家伙会盯着你看；离得远的，就各忙各的。</p>
    <div class="toolbar">
      <button id="btnNew" class="btn primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0 2.2 5.5M20 4v7h-7"/></svg>
        换一批新朋友
      </button>
      <span class="hint">或按 <kbd>空格</kbd>　·　点一点小动物会有惊喜</span>
    </div>
    <p class="colophon"><span id="speciesTotal">15</span> SPECIES · ENDLESS PERSONALITIES · EVERY LITTLE LINE IS CODE</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
